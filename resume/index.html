<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khori Hutama — Resume</title>
<meta name="description" content="Resume — Khori Hutama, Backend Engineer.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<!-- Replace YOUR_DRIVE_PDF_LINK below with your actual Google Drive share link -->
<meta http-equiv="refresh" content="0; url=YOUR_DRIVE_PDF_LINK">
<link rel="canonical" href="YOUR_DRIVE_PDF_LINK">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FA; --panel:#FFFFFF; --border:#DFE5EC; --border-strong:#C7D0DB;
    --ink:#121A24; --ink-soft:#5B6B7F; --get:#2F6FED; --get-bg:#E8F0FE;
    --mono:'JetBrains Mono', ui-monospace, monospace; --sans:'Inter', -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0B0F14; --panel:#12181F; --border:#232B35; --border-strong:#333D4A;
      --ink:#E7ECF2; --ink-soft:#9AA7B5; --get:#6C9FFF; --get-bg:#152238; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:var(--sans); text-align:center; padding:24px;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:36px 32px; max-width:380px;
  }
  .spinner{
    width:22px; height:22px; margin:0 auto 18px; border-radius:50%;
    border:2.5px solid var(--border-strong); border-top-color:var(--get);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }
  p{margin:0 0 6px; font-family:var(--mono); font-size:13px; color:var(--ink-soft);}
  a{font-family:var(--mono); font-size:13px; color:var(--get); text-decoration:none;}
  a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <p>Redirecting to resume…</p>
    <a href="YOUR_DRIVE_PDF_LINK">Click here if it doesn't open automatically</a>
  </div>
  <script>
    location.replace("YOUR_DRIVE_PDF_LINK");
  </script>
</body>
</html>
